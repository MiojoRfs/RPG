<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crônicas de Eldoria — RPG idle medieval</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#0a0807;--line:#4a3820;--gold:#c9a14a;--txt:#e3d5b0;--mut:#a39270;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--txt);font:18px/1.5 'IM Fell English',Georgia,serif;background:radial-gradient(ellipse at 50% -10%,#2f1f10,transparent 60%),radial-gradient(ellipse at 50% 115%,#1e1014,transparent 55%),var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.fd{font-family:'Uncial Antiqua',Georgia,serif}
.gold{color:var(--gold)}.mut{color:var(--mut)}
.panel{background:linear-gradient(180deg,#1f1610,#110c0a);border:1px solid #6b5128;border-radius:3px;box-shadow:inset 0 0 0 4px #110c0a,inset 0 0 0 5px #6b512855,0 12px 32px #000b}
.row{background:#0e0a08;border:1px solid #3d2e18;border-radius:2px}
.btn{background:linear-gradient(#7d5c1f,#4a3410);border:1px solid var(--gold);color:#fff3d0;border-radius:3px;padding:.45rem 1rem;cursor:pointer}
.btn.sm{padding:.15rem .7rem;font-size:.9rem}
.btn:hover:not(:disabled){filter:brightness(1.3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;background:#0c0908;border:1px solid var(--line);border-radius:3px;padding:.6rem .8rem;color:var(--txt)}
.inp:focus{border-color:var(--gold);outline:0}
.bar{height:18px;background:#080605;border:1px solid var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;transition:width .5s}
.bar>b{position:absolute;inset:0;text-align:center;font:600 12px/16px Georgia,serif;text-shadow:0 1px 2px #000}
.tab{white-space:nowrap;padding:.4rem .9rem;border-radius:3px;border:1px solid var(--line);background:#120d0b;color:var(--mut);cursor:pointer}
.tab.on{background:#38280f;border-color:var(--gold);color:#fff3d0}
.slot{padding:.6rem;border:1px dashed var(--line);background:#0c0908;cursor:pointer;border-radius:2px}
.slot:hover{border-color:var(--gold)}
.av{position:relative;display:block;width:88px;height:88px;padding:4px;border-radius:50%;background:conic-gradient(var(--c),#2a1d0c,var(--gold),#2a1d0c,var(--c));box-shadow:0 0 26px -6px var(--c)}
.av .in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font-size:46px;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),#0a0706 75%)}
.av.lg{width:140px;height:140px}.av.lg .in{font-size:76px}
.lv{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#1b1209;border:1px solid var(--gold);color:var(--gold);border-radius:2px;padding:0 .8rem;font-size:.9rem;white-space:nowrap}
.card{display:block;width:100%;cursor:pointer}
.card:hover{border-color:var(--c)}
.card.on{border-color:var(--c);box-shadow:inset 0 0 0 4px #110c0a,inset 0 0 0 5px var(--c),0 0 28px -6px var(--c)}
.ember{position:fixed;bottom:-10px;border-radius:50%;background:#ff9a3c;box-shadow:0 0 8px 2px #ff7a1a88;opacity:0;pointer-events:none;z-index:0;animation:up linear infinite}
@keyframes up{0%{transform:translate(0,0);opacity:0}10%{opacity:.7}100%{transform:translate(40px,-105vh);opacity:0}}
@media(prefers-reduced-motion:reduce){.ember{display:none}*{animation:none!important}}
.t4{background:linear-gradient(90deg,#ff1744,#a020f0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.t5{color:#00e5ff;text-shadow:0 0 6px #00e5ff;font-weight:700}
.t6{color:#ffd700;text-shadow:0 0 8px #ffd700;font-weight:700}
.lc{color:#ffb02e;font-weight:700}
.ld{color:#ff4d4d;font-weight:700;animation:bl .6s steps(2,start) infinite}
#log p{margin:0;padding:1px 0}
.rr0,.rr1,.rr2,.rr3{border-color:var(--rc)!important}
.rr4{animation:rp 1.6s ease-in-out infinite}
.rr5{border-color:#00e5ff;animation:gl 2.2s infinite}
.rr6{background:linear-gradient(135deg,#000,#2a2208,#000)!important;animation:dv 1.8s ease-in-out infinite}
.av[data-au]:not([data-au="0"]){animation:aur 2.4s ease-in-out infinite}
.av[data-au="1"]{--a1:#ff8a2a;--a2:#a01800}
.av[data-au="2"]{--a1:#ffd23a;--a2:#ff6a00}
.av[data-au="3"]{--a1:#a020f0;--a2:#ff1744}
.av[data-au="4"]{--a1:#00e5ff;--a2:#2962ff}
.av[data-au="5"]{--a1:#ffd700;--a2:#3a2c00;background:conic-gradient(#000,#ffd700,#000,#ffd700,#000)}
.fl{position:fixed;inset:0;z-index:55;pointer-events:none;box-shadow:inset 0 0 140px 40px #f00;animation:fl 1.8s ease-out forwards}
#mdl{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;overflow:hidden;background:color-mix(in srgb,var(--mc) 25%,#000e)}
#mdl::before{content:'';position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(var(--mc) 0 8deg,transparent 8deg 24deg);opacity:.22;animation:spin 14s linear infinite}
.mbox{position:relative;animation:burst .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes bl{50%{opacity:.2}}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes burst{0%{transform:scale(.2);filter:brightness(6)}100%{transform:scale(1);filter:none}}
@keyframes fl{0%{opacity:0}15%{opacity:1}35%{opacity:.2}55%{opacity:1}100%{opacity:0}}
@keyframes rp{0%,100%{box-shadow:0 0 10px 1px #ff1744,inset 0 0 12px #ff174455;border-color:#ff1744}50%{box-shadow:0 0 18px 4px #a020f0,inset 0 0 14px #a020f066;border-color:#a020f0}}
@keyframes gl{0%,100%{box-shadow:0 0 12px #00e5ff}20%{box-shadow:-3px 0 0 #00e5ff,3px 0 0 #2979ff;transform:translate(1px,0)}24%{transform:none}60%{box-shadow:0 0 16px 3px #00e5ff;filter:hue-rotate(25deg)}62%{filter:none;transform:translate(-2px,1px);box-shadow:3px 0 0 #00e5ff,-3px 0 0 #2979ff}66%{transform:none}}
@keyframes dv{0%,100%{box-shadow:0 0 14px 2px #ffd700,inset 0 0 14px #ffd70055;border-color:#ffd700}50%{box-shadow:0 0 30px 8px #ffd700,0 0 4px 1px #fff,inset 0 0 22px #ffd700aa;border-color:#fff3a0}}
@keyframes aur{0%,100%{box-shadow:0 0 20px 2px var(--a1),0 0 46px 8px var(--a2)}50%{box-shadow:0 0 34px 8px var(--a2),0 0 70px 16px var(--a1)}}
</style>
</head>
<body>
<div id="app" class="relative z-10 mx-auto max-w-6xl p-3 sm:p-5"></div>
<div id="toast" class="fixed inset-x-0 bottom-0 z-50 flex flex-col items-center gap-2 px-3 pointer-events-none" style="padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))"></div>
<script>
/* ===== Utilitários e persistência ===== */
const $=s=>document.querySelector(s),mem={},esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),f=(n,d=1)=>n.toFixed(d).replace('.',',');
const S={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const H=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('eldoria:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}};
const DB=()=>{try{return JSON.parse(S.get('eld_db')||'{}')}catch(e){return{}}},W=d=>S.set('eld_db',JSON.stringify(d));

/* ===== Integração com Servidor Python ===== */
const AH=()=>({'Content-Type':'application/json','Authorization':'Bearer '+TOK});
function kick(msg){clearInterval(T);S.del('eld_tok');S.del('eld_ses');TOK=null;ADM=false;U=P=null;mode='in';authScreen();const e=$('#err');if(e)e.textContent=msg}
async function persist(){
 if(!U||!P)return;
 const d=DB();d[U]=d[U]||{};d[U].p=P;W(d);
 try {
  P.cp = stats().cp | 0;
  const res = await fetch(SRV+'/api/save', {method:'POST',headers:AH(),body:JSON.stringify({username:U,player_data:P}),keepalive:true});
  if(res.status===401)kick('Sua conta foi aberta em outro lugar ou a sessão expirou. Entre novamente.');
  else if(res.status===403){const j=await res.json().catch(()=>({}));kick(j.detail||'Conta bloqueada.')}
  else if(!res.ok)console.warn('Falha ao salvar no servidor:',res.status);
  else{const j=await res.json().catch(()=>({}));if(j.updated&&P){const k=P.last;Object.assign(P,j.updated);P.last=k;toast('🛠️ O administrador atualizou sua conta.');refresh()}}
 } catch(e) { console.warn('Servidor indisponível, salvo só localmente.', e); }
}

/* ===== Dados do jogo ===== */
const ATTR=[['for','Força','💪','Dano físico'],['agi','Agilidade','⚡','Dano e chance crítica'],['int','Inteligência','📘','Dano arcano e +1% de XP por ponto'],['sor','Sorte','🍀','+1% de ouro e drops por ponto, crítico'],['vit','Vitalidade','❤️','Vida máxima e resistência na caça']];
const CLS={
 guerreiro:{n:'Guerreiro',t:'Atacante',i:'⚔️',c:'#c0392b',a:{for:8,agi:4,int:1,sor:3,vit:7},p:'Fúria de batalha',d:'+15% de dano e +10% de vida máxima',m:{dmg:.15,hp:.1},w:'espada'},
 mago:{n:'Mago',t:'Conjurador',i:'🧙',c:'#8a6cff',a:{for:1,agi:5,int:9,sor:5,vit:3},p:'Sabedoria arcana',d:'+20% de XP ganho e +10% de dano',m:{xp:.2,dmg:.1},w:'cajado'},
 arqueiro:{n:'Arqueiro',t:'Atirador',i:'🏹',c:'#3aa55f',a:{for:3,agi:8,int:2,sor:6,vit:4},p:'Olho de águia',d:'+15% de ouro e +8% de chance crítica',m:{gold:.15,crit:.08},w:'arco'},
 paladino:{n:'Paladino',t:'Defensor',i:'🛡️',c:'#e0b84a',a:{for:6,agi:2,int:4,sor:2,vit:9},p:'Bênção sagrada',d:'+20% de vida máxima e regeneração dobrada',m:{hp:.2,regen:1},w:'martelo'},
 assassino:{n:'Assassino',t:'Furtivo',i:'🗡️',c:'#c2417a',a:{for:4,agi:9,int:2,sor:5,vit:3},p:'Golpe fatal',d:'+12% de chance crítica e +10% de dano',m:{crit:.12,dmg:.1},w:'adaga'}
};
const IT={
 espada:{n:'Espada enferrujada',i:'🗡️',s:'arma',b:{for:3},v:8},cajado:{n:'Cajado de carvalho',i:'🪄',s:'arma',b:{int:3},v:8},
 arco:{n:'Arco curto',i:'🏹',s:'arma',b:{agi:3},v:8},martelo:{n:'Martelo bento',i:'🔨',s:'arma',b:{for:2,vit:1},v:8},
 adaga:{n:'Adaga sombria',i:'🔪',s:'arma',b:{agi:2,sor:1},v:8},couro:{n:'Gibão de couro',i:'🥋',s:'armadura',b:{vit:2},v:15},
 anel:{n:'Anel de cobre',i:'💍',s:'acessorio',b:{sor:2},v:20},pele:{n:'Pele de lobo',i:'🐺',v:6},gosma:{n:'Gosma pantanosa',i:'🧪',v:12},gema:{n:'Gema bruta',i:'💎',v:40}
};
const TR=[
 {id:'t1',n:'Boneco de palha',i:'🎯',lv:1,xp:1.2,d:'Golpes repetidos no pátio da vila.'},
 {id:'t2',n:'Arena dos veteranos',i:'🏟️',lv:5,xp:3.5,d:'Duelos de treino contra mercenários.'},
 {id:'t3',n:'Torre do mestre',i:'🗼',lv:10,xp:9,d:'Disciplina dura sob o olhar do arquimestre.'}];
const HT=[
 {id:'h1',n:'Floresta sussurrante',i:'🌲',lv:1,xp:.8,g:.6,dg:.5,l:[['pele',.02]],d:'Lobos e javalis rondam as clareiras.'},
 {id:'h2',n:'Pântano maldito',i:'🐸',lv:5,xp:2.4,g:1.8,dg:1.6,l:[['gosma',.02],['pele',.02]],d:'Criaturas viscosas escondem tesouros na lama.'},
 {id:'h3',n:'Cavernas de cristal',i:'💎',lv:10,xp:6,g:5,dg:4,l:[['gema',.015],['gosma',.02]],d:'Golens de cristal guardam gemas brutas.'}];
const TABS=[['treino','🎯','Treinamento'],['cacar','🐺','Caça e farm'],['inv','🎒','Inventário'],['attr','📜','Atributos'],['loja','🛒','Loja'],['ferr','⚒️','Ferreiro'],['rank','🏆','Ranking']];

/* ===== Estado ===== */
let U=null,P=null,T=null,tab='treino',mode='in',pick=null,dirty=false,TOK=S.get('eld_tok'),ADM=false;
const need=(l=P.level)=>Math.floor(100*1.35**(l-1));

function stats(){
 const c=CLS[P.cls],t={...P.at},b={},m=c.m;
 for(const k in P.eq){const it=IT[P.eq[k]];if(it)for(const a in it.b){t[a]+=it.b[a];b[a]=(b[a]||0)+it.b[a]}}
 const s={t,b,m,max:Math.floor((50+t.vit*10+P.level*5)*(1+(m.hp||0))),dmg:Math.floor((t.for*2+t.agi+t.int*2+P.level*2)*(1+(m.dmg||0))),crit:f(Math.min(60,t.agi*.5+t.sor*.3+(m.crit||0)*100)),xm:1+(m.xp||0)+t.int*.01+pas('xp')+sk('xp'),gm:1+(m.gold||0)+t.sor*.01+sk('gd'),vr:1-Math.min(.7,t.vit*.015)};s.cp=Math.floor(s.dmg*6+s.max*.5+(t.agi*.5+t.sor*.3+(m.crit||0)*100)*8)*(1+sk('cp'))|0;return s
}
function gain(x){P.xp+=x;while(P.xp>=need()){P.xp-=need();P.level++;P.pts+=3;P.hp=stats().max;dirty=true;sfx.lvl();toast('🎉 Nível '+P.level+'! Você ganhou 3 pontos de atributo.')}}
function tick(){
 const n=Date.now(),dt=Math.min((n-P.last)/1000,28800);P.last=n;if(dt<=0)return;
 nb=dt>5;const s=stats(),a=P.act,z=a&&(a.t==='h'?HT:TR).find(x=>x.id===a.id);let t=z?dt:0,rest=dt;
 if(z&&a.t==='h'){const dr=z.dg*s.vr*risk(z)/100;t=Math.min(dt,P.hp/dr);P.hp-=dr*t;rest=dt-t;if(P.hp<=.01)die('Vida esgotada na caçada.');else{const r=risk(z)/100;if(r>0&&Math.random()<1-Math.pow(1-r,t/60)){t*=Math.random();die('Derrotado por '+z.n+'.')}}}
 if(z){gain(z.xp*s.xm*t);if(z.g)P.gold+=z.g*s.gm*t;(z.l||[]).forEach(([id,p])=>{const q=Math.floor(p*s.gm*t+Math.random());if(q>0){P.inv[id]=(P.inv[id]||0)+q;dirty=true}});if(a.t==='h'&&t>0)hunt(z,s,t)}
 P.hp=Math.min(s.max,P.hp+s.max*.01*(1+(s.m.regen||0))*rest);
}
function loop(){clearInterval(T);let n=0;T=setInterval(()=>{tick();if(dirty){dirty=false;refresh()}else paint();if(++n%5===0)persist()},1000)}
function toast(m){const d=document.createElement('div');d.className='panel px-4 py-2 text-sm';d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3800)}

/* ===== Autenticação Modificada ===== */
function authScreen(){
 $('#app').innerHTML=`<div class="min-h-[85vh] grid place-items-center"><div class="panel w-full max-w-md p-7">
 <div class="text-center mb-5"><div class="text-5xl">🏰</div><h1 class="fd text-3xl gold mt-2">Crônicas de Eldoria</h1><p class="mut">Treine e cace mesmo longe da tela: seu herói continua a jornada.</p></div>
 <div class="grid grid-cols-2 gap-2 mb-4"><button class="tab ${mode==='in'?'on':''}" onclick="mode='in';authScreen()">Entrar</button><button class="tab ${mode==='up'?'on':''}" onclick="mode='up';authScreen()">Criar conta</button></div>
 <div class="space-y-3"><input id="u" class="inp" placeholder="Usuário" autocomplete="username" maxlength="16"><input id="pw" type="password" class="inp" placeholder="Senha" autocomplete="${mode==='in'?'current-password':'new-password'}">${mode==='up'?'<input id="pw2" type="password" class="inp" placeholder="Repita a senha" autocomplete="new-password">':''}
 <p id="err" class="text-sm min-h-[1.5rem]" style="color:#e58a78"></p><button class="btn w-full py-2" onclick="auth()">${mode==='in'?'Entrar':'Criar conta'}</button></div>
 <p class="mut text-sm text-center mt-4" style="color:#7fd08a">🌐 Conectado ao Servidor Global. Seu progresso agora é online!</p>${mode==='in'?'<p class="mut text-xs text-center mt-2">Conta antiga, criada antes das senhas online? Entre com a senha que quiser: ela passa a valer a partir do primeiro acesso.</p>':''}</div></div>`;
}
async function auth(){
 const u=$('#u').value.trim().toLowerCase(),pw=$('#pw').value,e=$('#err');
 if(!/^[a-z0-9_]{3,16}$/.test(u))return e.textContent='Use de 3 a 16 caracteres: letras, números ou _ no usuário.';
 if(pw.length<4)return e.textContent='A senha precisa ter pelo menos 4 caracteres.';
 if(mode==='up'&&pw!==$('#pw2').value)return e.textContent='As senhas não coincidem.';
 e.textContent='Conectando ao servidor... (pode levar até 1 minuto se ele estiver dormindo)';
 try{
  const r=await fetch(SRV+'/api/'+(mode==='up'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:pw})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)return e.textContent=(typeof j.detail==='string'?j.detail:'Dados inválidos.');
  TOK=j.token;S.set('eld_tok',TOK);
 }catch(x){return e.textContent='Servidor indisponível. Tente de novo em instantes.'}
 enter(u)
}
async function enter(u){
 if(!TOK)return kick('O login mudou: entre novamente com seu usuário e senha.');
 U=u;S.set('eld_ses',u);
 try {
  const res = await fetch(`${SRV}/api/load/${u}`,{headers:AH()});
  if(res.status===401)return kick('Sessão expirada. Entre novamente.');
  if(res.status===403){const j=await res.json().catch(()=>({}));return kick(j.detail||'Conta bloqueada.')}
  const data = await res.json();
  ADM=!!data.admin;
  const remote = (data.status === 'encontrado' && data.player_data) ? data.player_data : null;
  const local = DB()[u] ? DB()[u].p : null;
  // usa o save mais novo (campo "last"), em vez de sempre confiar no servidor
  P = (remote && local) ? ((local.last||0) > (remote.last||0) ? local : remote) : (remote || local);
 } catch(e) {
  P = DB()[u]?DB()[u].p:null;
 }
 if(!P)return classScreen();
 P.eq=Object.assign({arma:null,armadura:null,elmo:null,acessorio:null,aura:null},P.eq);if(P.eq.anel!==undefined){P.eq.acessorio=P.eq.acessorio||P.eq.anel;delete P.eq.anel}
 const t0=P.last,g=P.gold,l=P.level;tick();
 if(Date.now()-t0>6e4&&P.act)toast('⏳ Enquanto você esteve fora: +'+Math.floor(P.gold-g)+' ouro e +'+(P.level-l)+' nível(is).');
 dash();loop();checkNews()
}
function logout(){tick();persist();clearInterval(T);S.del('eld_ses');S.del('eld_tok');TOK=null;ADM=false;U=P=null;mode='in';authScreen()}

/* ===== Seleção de classe ===== */
function classScreen(){
 pick=null;
 $('#app').innerHTML=`<div class="py-4"><div class="text-center mb-6"><h2 class="fd text-3xl gold">Escolha seu destino</h2><p class="mut">Cada classe concede bônus passivos permanentes.</p></div>
 <div class="max-w-sm mx-auto mb-6"><input id="hn" class="inp text-center" maxlength="14" placeholder="Nome do herói"></div>
 <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">${Object.entries(CLS).map(([k,c])=>`<button class="panel card p-4 text-center" id="c_${k}" style="--c:${c.c}" onclick="pickC('${k}')"><span class="av mx-auto"><span class="in">${c.i}</span></span><span class="block fd text-xl mt-3" style="color:${c.c}">${c.n}</span><span class="block mut italic">${c.t}</span><span class="block gold mt-2">${c.p}</span><span class="block text-sm mut">${c.d}</span><span class="block text-sm mt-2">${ATTR.map(a=>a[2]+c.a[a[0]]).join(' ')}</span></button>`).join('')}</div>
 <div class="text-center mt-6"><p id="err" class="text-sm min-h-[1.5rem]" style="color:#e58a78"></p><button class="btn px-8 py-2" onclick="begin()">Iniciar jornada</button></div></div>`;
}
function pickC(k){pick=k;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('on',x.id==='c_'+k))}
function begin(){
 const n=$('#hn').value.trim(),e=$('#err');
 if(n.length<2)return e.textContent='Dê um nome ao herói, com pelo menos 2 letras.';
 if(!pick)return e.textContent='Escolha uma classe para continuar.';
 const c=CLS[pick];
 P={name:n,cls:pick,level:1,xp:0,gold:50,pts:0,at:{...c.a},inv:{couro:1,anel:1},eq:{arma:c.w,armadura:null,elmo:null,acessorio:null,aura:null},act:null,hp:0,last:Date.now()};
 P.hp=stats().max;persist();dash();loop()

 paladino:[['Luz curativa','Cura 50% da vida e reduz o risco de morte pela metade por 20 s',5,20,90,{heal:.5,safe:.5}],['Escudo divino','Zera o risco de morte por 15 s',10,15,180,{safe:1}]],
 assassino:[['Passo sombrio','−50% de risco de morte e +20% de drops por 30 s',5,30,90,{safe:.5,dr:.2}],['Golpe fatal','+60% de CP e +100% de ouro por 20 s',10,20,180,{cp:.6,gd:1}]]
};
const sk=k=>nb||!P.sk?0:SK[P.cls].reduce((x,s,i)=>x+(P.sk[i]&&P.sk[i].u>Date.now()&&s[5][k]||0),0);
function skbar(){$('#skb').innerHTML=SK[P.cls].map((s,i)=>`<button class='btn flex-1' id='sk${i}' onclick='useSk(${i})' title='${s[1]}'></button>`).join('')}
function skUI(){const now=Date.now();let m=0;SK[P.cls].forEach((s,i)=>{const st=P.sk&&P.sk[i],on=st&&st.u>now,cd=st&&st.c>now,b=$('#sk'+i);if(on)m|=1<<i;if(!b)return;b.textContent=P.level<s[2]?`🔒 ${s[0]} (Nv ${s[2]})`:on?`✨ ${s[0]} ${Math.ceil((st.u-now)/1000)}s`:cd?`⏳ ${s[0]} ${Math.ceil((st.c-now)/1000)}s`:`⚡ ${s[0]}`;b.disabled=P.level<s[2]||!!cd});if(m!==skm){skm=m;refresh()}}
function useSk(i){const s=SK[P.cls][i],st=P.sk&&P.sk[i],n=Date.now();if(P.level<s[2]||st&&st.c>n)return;P.sk=P.sk||{};P.sk[i]={u:n+s[3]*1e3,c:n+s[4]*1e3};sfx.skill();if(s[5].heal)P.hp=Math.min(stats().max,P.hp+stats().max*s[5].heal);log(`✨ ${s[0]} ativada! ${s[1]}.`,'lc');refresh()}
const cpd=id=>{const sl=IT[id].s,o=P.eq[sl],b=stats().cp;P.eq[sl]=id;const d=stats().cp-b;P.eq[sl]=o;return`<b style='color:${d>0?'#7fd08a':d<0?'#ff6a5a':'#a39270'}'>(${d>0?'+':''}${d} CP)</b>`};
function sellAll(mx){let g=0;for(const id in P.inv){const it=IT[id];if(it.s&&(it.r||0)<=mx&&P.inv[id]>0){g+=it.v*P.inv[id];P.inv[id]=0}}if(!g)return toast('Nada para vender.');P.gold+=g;toast('💰 Vendido por '+g+' de ouro.');refresh()}
function respec(){const c=50*P.level;if(P.gold<c)return toast('💰 Ouro insuficiente para redistribuir.');P.gold-=c;P.at={...CLS[P.cls].a};P.pts=(P.level-1)*3;P.hp=Math.min(P.hp,stats().max);refresh()}

/* ===== Parte 5: Ranking Online e Utilitários ===== */
let rs='cp',AC=null,snd=S.get('eld_snd')!=='0';
const NPC=[['Sir Aldric','guerreiro',12,900],['Lyra Sombralua','assassino',18,2600],['Mestre Orvyn','mago',25,5200],['Thalia Ventoforte','arqueiro',31,8800],['Dama Seraphine','paladino',38,14000],['Kael, o Devorador','assassino',46,23000],['Archimago Vael','mago',55,37000],['Rei Eldoran','guerreiro',70,60000]];
const mrx=p=>Math.max(p.mr||0,...Object.keys(p.inv).filter(k=>p.inv[k]>0).map(k=>IT[k]&&IT[k].r||0),...Object.values(p.eq).map(k=>k&&IT[k]?IT[k].r||0:0));
const ACH=[['Aprendiz','Chegue ao nível 5',p=>p.level>=5],['Veterano','Chegue ao nível 20',p=>p.level>=20],['Lenda viva','Chegue ao nível 50',p=>p.level>=50],['Bolso cheio','Tenha 10.000 de ouro',p=>p.gold>=1e4],['Mão de ferro','Forje 5 equipamentos',p=>(p.fg||0)>=5],['Escola da morte','Morra 3 vezes',p=>(p.dd||0)>=3],['Brilho lendário','Encontre um item Lendário',p=>mrx(p)>=3],['Sangue mítico','Encontre um item Mítico',p=>mrx(p)>=4],['Segredo do vazio','Encontre um item Secreto',p=>mrx(p)>=5],['Palavra do criador','Encontre um item Administrador',p=>mrx(p)>=6]];

/* ===== Fetch assíncrono do Ranking ===== */
function rankT(){
 setTimeout(async () => {
  try {
   const res = await fetch('https://rpg-1-vizh.onrender.com/api/ranking');
   const serverRank = await res.json();
   let L = serverRank.map(x => ({n: x.n, u: x.u, i: CLS[x.cls]?CLS[x.cls].i:'👤', l: x.l, cp: x.cp, me: x.u === U}));
   L = L.concat(NPC.map(([n,k,l,cp])=>({n,u:'',i:CLS[k].i,l,cp,me:false})));
   L.sort((a,b)=>b[rs]-a[rs]||b.cp-a.cp);
   const pos=L.findIndex(x=>x.me)+1, ok=ACH.filter(a=>a[2](P)).length;
   const el = document.getElementById('rankContent');
   if(el) el.innerHTML = `<p class='mut mb-2'>Você está em ${pos}º de ${L.length}. Rivais do servidor global competem aqui.</p><div class='space-y-1 mb-6'>${L.map((x,i)=>`<div class='flex items-center gap-3 p-2 row' ${x.me?`style='border-color:var(--gold)'`:''}><b class='w-8 text-center'>${['🥇','🥈','🥉'][i]||i+1}</b><span class='text-2xl'>${x.i}</span><div class='flex-1 min-w-0'>${esc(x.n)}${x.me?' (você)':''}</div><span class='mut'>Nv ${x.l}</span><b class='gold w-20 text-right'>${x.cp.toLocaleString('pt-BR')}</b></div>`).join('')}</div><h3 class='fd gold mb-2'>Conquistas (${ok}/${ACH.length})</h3><div class='grid gap-2 sm:grid-cols-2'>${ACH.map(a=>{const d=a[2](P);return`<div class='p-3 row ${d?'':'opacity-50'}'><b class='${d?'gold':''}'>${d?'🏆':'🔒'} ${a[0]}</b><div class='text-sm mut'>${a[1]}</div></div>`}).join('')}</div>`;
  } catch(e) {
   const el = document.getElementById('rankContent');
   if(el) el.innerHTML = "<p class='ld'>Erro ao carregar o ranking global. Servidor offline.</p>";
  }
 }, 0);
 return `<div class='flex flex-wrap items-center gap-2 mb-2'><h3 class='fd gold'>Ranking</h3><button class='tab ${rs==='cp'?'on':''}' onclick='rs="cp";tabR()'>Por CP</button><button class='tab ${rs==='l'?'on':''}' onclick='rs="l";tabR()'>Por nível</button></div><div id="rankContent"><p class="mut">Carregando o ranking do servidor...</p></div>`;
}

const SKIN={armadura3:['🐲','Cavaleiro-dragão'],armadura4:['😈','Senhor do Cataclismo'],sec0:['🥷','Sombra do Vazio'],sec1:['🌠','Viajante estelar'],sec2:['👽','Singularidade'],adm0:['🧑‍💻','Desenvolvedor absoluto'],adm1:['😇','Divindade']};
const skn=()=>{const id=Object.values(P.eq).filter(i=>SKIN[i]).sort((a,b)=>IT[b].r-IT[a].r)[0];return id?SKIN[id]:null};
function tone(f,d=.15,t='sine',v=.1,w=0){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+w;o.type=t;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const sfx={click:()=>tone(520,.05,'square',.04),equip:()=>{tone(330,.08,'triangle');tone(495,.12,'triangle',.1,.07)},forge:()=>{tone(140,.12,'sawtooth',.14);tone(900,.05,'square',.05,.03);tone(120,.15,'sawtooth',.12,.2);tone(1100,.05,'square',.05,.23)},lvl:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.1)),die:()=>[300,220,150,90].forEach((f,i)=>tone(f,.3,'sawtooth',.12,i*.18)),skill:()=>{tone(200,.4,'sawtooth',.08);tone(600,.3,'triangle',.1,.1)},drop:r=>{for(let i=0;i<=r;i++)tone(400+i*120,.2+r*.04,r>4?'sine':'triangle',.07+r*.012,i*.08);if(r>=5)[523,659,784,988,1319].forEach((f,i)=>tone(f,1,'sine',.07,.7+i*.02))}};
function togSnd(){snd=!snd;S.set('eld_snd',snd?'1':'0');$('#snd').textContent=snd?'🔊':'🔇';sfx.click()}
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx.click()});

$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#u'))auth()});
addEventListener('visibilitychange',()=>{if(P){tick();persist()}});
addEventListener('pagehide',()=>{if(P){tick();persist()}});
for(let i=0;i<16;i++){const e=document.createElement('i'),z=2+Math.random()*3;e.className='ember';e.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${7+Math.random()*9}s;animation-delay:${-Math.random()*12}s`;document.body.append(e)}
/* ===== Novidades / status do servidor ===== */
const SRV='https://rpg-1-vizh.onrender.com',VERSION='1.3.0';
// Para cada atualização: aumente VERSION e adicione uma linha NO TOPO desta lista
const NEWS=[
 ['1.3.0','11/11/2026',['Moderação: contas banidas somem do ranking e não conseguem entrar','O administrador pode devolver itens e ouro a quem perdeu progresso']],
 ['1.2.0','11/11/2026',['Senha agora fica no servidor: dá para entrar de qualquer aparelho','Contas antigas: a primeira senha digitada passa a valer','Abrir a conta em outro lugar encerra a sessão anterior (evita sobrescrever o progresso)']],
 ['1.1.0','11/11/2026',['Correção: o progresso não volta mais ao sair do jogo','Salvamento mais seguro (usa sempre o save mais novo)','Novo painel de novidades e status do servidor']]
];
async function showNews(){
 let m=$('#news');if(m){m.remove();return}
 m=document.createElement('div');m.id='news';
 m.style.cssText='position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:1rem;background:#000c';
 m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class='panel p-6 w-full max-w-md' style='max-height:85vh;overflow:auto'><div class='flex justify-between items-center mb-3'><h3 class='fd gold text-xl'>📜 Novidades</h3><button class='btn sm' onclick='$("#news").remove()'>Fechar</button></div><div id='srv' class='row p-3 text-sm mb-4 mut'>Verificando servidor...</div>${NEWS.map(n=>`<div class='mb-3'><b class='gold'>v${n[0]}</b> <span class='mut text-sm'>${n[1]}</span><ul class='text-sm' style='list-style:disc;padding-left:1.2rem'>${n[2].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`;
 document.body.append(m);
 const box=$('#srv');
 try{
  const v=await(await fetch(SRV+'/api/version')).json();
  const diff=v.version!==VERSION?`<br>⚠️ Jogo v${VERSION} e servidor v${v.version} estão em versões diferentes. Se acabou de subir uma atualização, aguarde o deploy.`:'';
  const sql=v.db==='sqlite'?`<br>⚠️ Banco SQLite: no Render os dados podem ser apagados. Configure o DATABASE_URL.`:'';
  if(box)box.innerHTML=`🟢 Servidor online<br>Jogo: v${VERSION} · Servidor: v${v.version} · commit ${v.commit}<br>Banco: ${v.db} · ligado desde ${new Date(v.started_at).toLocaleString('pt-BR')}${diff}${sql}`;
 }catch(e){if(box)box.innerHTML=`🔴 Servidor offline ou acordando (o Render grátis demora cerca de 1 min). Tente de novo.`}
}
async function checkNews(){
 const old=S.get('eld_ver');S.set('eld_ver',VERSION);
 if(old&&old!==VERSION){toast('🆕 Atualização v'+VERSION+'! Veja as novidades em 📜');showNews()}
 try{
  const v=await(await fetch(SRV+'/api/version')).json(),k=v.version+'|'+v.commit,o=S.get('eld_srv');S.set('eld_srv',k);
  if(o&&o!==k)toast('🛠️ Servidor atualizado (v'+v.version+', commit '+v.commit+')');
 }catch(e){}
}

/* ===== Painel do administrador ===== */
let admSel=null;
async function adm(path,body){
 const r=await fetch(SRV+'/api/admin/'+path,{method:body?'POST':'GET',headers:AH(),body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Erro '+r.status);
 return j;
}
const admV=id=>(($('#'+id)||{}).value||'');
function showAdmin(){
 let m=$('#admm');if(m)m.remove();
 m=document.createElement('div');m.id='admm';
 m.style.cssText='position:fixed;inset:0;z-index:49;display:grid;place-items:center;padding:1rem;background:#000d';
 m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class='panel p-5 w-full max-w-2xl' style='max-height:90vh;overflow:auto'><div class='flex justify-between items-center mb-3'><h3 class='fd gold text-xl'>🛠️ Painel do administrador</h3><button class='btn sm' onclick='$("#admm").remove()'>Fechar</button></div><div class='flex gap-2 mb-3'><input id='admq' class='inp' placeholder='Buscar jogador...' onkeydown='if(event.key==="Enter")admList()'><button class='btn' onclick='admList()'>Buscar</button></div><div id='admc'></div></div>`;
 document.body.append(m);admList();
}
async function admList(){
 const c=$('#admc');if(!c)return;admSel=null;c.innerHTML='<p class="mut">Carregando...</p>';
 try{
  const L=await adm('players?q='+encodeURIComponent(admV('admq')));
  c.innerHTML=L.length?`<div class='space-y-1'>${L.map(x=>`<div class='flex items-center gap-3 p-2 row'><div class='flex-1 min-w-0'>${esc(x.u)}${x.admin?' 👑':''}${x.banned?' <span class="ld">BANIDO</span>':''}</div><span class='mut'>Nv ${x.l}</span><b class='gold w-20 text-right'>${(x.cp||0).toLocaleString('pt-BR')}</b><button class='btn sm' onclick='admOpen("${esc(x.u)}")'>Abrir</button></div>`).join('')}</div>`:'<p class="mut">Nenhum jogador.</p>';
 }catch(e){c.innerHTML=`<p class='ld'>${esc(e.message)}</p>`}
}
async function admOpen(u){
 const c=$('#admc');if(!c)return;admSel=u;c.innerHTML='<p class="mut">Carregando...</p>';
 try{
  const j=await adm('player/'+encodeURIComponent(u)),d=j.data||{},inv=Object.entries(d.inv||{}).filter(([,q])=>q>0),eqp=Object.values(d.eq||{}).filter(Boolean);
  const nm=id=>IT[id]?IT[id].i+' '+IT[id].n:esc(id);
  const opts=Object.keys(IT).map(k=>`<option value='${k}'>${esc(IT[k].n)}${IT[k].r?' ('+RN[IT[k].r]+')':''}</option>`).join('');
  const row=(t,h)=>`<div class='p-3 row mb-2'><div class='text-sm gold mb-1'>${t}</div><div class='flex flex-wrap gap-2 items-center'>${h}</div></div>`;
  c.innerHTML=`<button class='btn sm mb-3' onclick='admList()'>← Voltar</button>
  <div class='p-3 row mb-3'><b class='fd gold text-lg'>${esc(j.username)}</b>${j.banned?` <span class='ld'>BANIDO</span><div class='text-sm' style='color:#ff6a5a'>${esc(j.ban_msg)}</div>`:''}
  <div class='text-sm mut'>${d.cls?(CLS[d.cls]?CLS[d.cls].n:d.cls)+' · ':''}Nv ${d.level||'-'} · 💰 ${Math.floor(d.gold||0).toLocaleString('pt-BR')} · pontos livres ${d.pts||0}${j.pending?` · ⏳ ${j.pending} ação(ões) pendente(s)`:''}</div>
  <div class='text-sm mt-1'>Equipado: ${eqp.length?eqp.map(nm).join(', '):'nada'}</div>
  <div class='text-sm mt-1'>Mochila: ${inv.length?inv.map(([id,q])=>nm(id)+' ×'+q).join(', '):'vazia'}</div></div>
  ${row('Item',`<select id='admi' class='inp' style='width:auto;max-width:100%'>${opts}</select><input id='admqty' type='number' min='1' value='1' class='inp' style='width:6rem'><button class='btn sm' onclick='admAct("item",1)'>Dar</button><button class='btn sm' onclick='admAct("item",-1)'>Remover</button>`)}
  ${row('Ouro',`<input id='admg' type='number' min='1' value='1000' class='inp' style='width:9rem'><button class='btn sm' onclick='admAct("gold",1)'>Dar</button><button class='btn sm' onclick='admAct("gold",-1)'>Tirar</button>`)}
  ${row('Nível (zera o XP do nível; ao subir, dá +3 pontos por nível)',`<input id='adml' type='number' min='1' value='${d.level||1}' class='inp' style='width:6rem'><button class='btn sm' onclick='admAct("level")'>Definir</button>`)}
  ${row('Banimento',`<input id='admr' class='inp' placeholder='Motivo' style='width:12rem'><input id='admh' type='number' min='0' placeholder='Horas (0 = permanente)' class='inp' style='width:12rem'><button class='btn sm' onclick='admBan()'>Banir</button><button class='btn sm' onclick='admDo("unban",{username:admSel},"Desbanido.")'>Desbanir</button>`)}
  ${row('Senha',`<input id='admp' class='inp' placeholder='Nova senha' style='width:12rem'><button class='btn sm' onclick='admPw()'>Redefinir senha</button>`)}
  ${row('Zona de perigo',`<button class='btn sm' style='border-color:#ff4d4d' onclick='admDel()'>Excluir conta</button>`)}
  <p class='text-sm mut'>Itens, ouro e nível chegam ao jogador em até 5 s se ele estiver online, ou no próximo login.</p>`;
 }catch(e){c.innerHTML=`<p class='ld'>${esc(e.message)}</p><button class='btn sm' onclick='admList()'>← Voltar</button>`}
}
async function admDo(path,body,msg){try{await adm(path,body);toast('✅ '+msg);admOpen(admSel)}catch(e){toast('⚠️ '+e.message)}}
function admAct(kind,sg=1){
 const b={username:admSel,t:kind};
 if(kind==='item'){b.id=admV('admi');b.q=sg*Math.floor(+admV('admqty')||0)}
 else if(kind==='gold')b.q=sg*Math.floor(+admV('admg')||0);
 else b.v=Math.floor(+admV('adml')||0);
 admDo('action',b,'Ação enfileirada.');
}
function admBan(){admDo('ban',{username:admSel,reason:admV('admr'),hours:Math.max(0,Math.floor(+admV('admh')||0))},'Jogador banido.')}
function admPw(){admDo('set-password',{username:admSel,new_password:admV('admp')},'Senha redefinida.')}
async function admDel(){
 if(!confirm('Excluir a conta "'+admSel+'" e todo o progresso? Isso não pode ser desfeito.'))return;
 try{await adm('delete',{username:admSel});toast('🗑️ Conta excluída.');admList()}catch(e){toast('⚠️ '+e.message)}
}

const ses=S.get('eld_ses');ses&&TOK?enter(ses):authScreen();
</script>
